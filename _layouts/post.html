---
layout: default
---
<article>
<header class="post-header">
  <h1>{{ page.title }}</h1>
  <p class="post-meta">
    <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%-d %B %Y' }}</time>
    {%- if page.updated %} · updated {{ page.updated | date: '%-d %B %Y' }}{% endif %}
  </p>
</header>

<div class="post-body">
{{ content }}
</div>
</article>

<p class="muted" style="margin-top:3rem"><a href="{{ '/blog/' | relative_url }}">All posts</a></p>
